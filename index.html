<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>จับคู่โน้ต</title>
    <meta
      name="description"
      content="เกมเปิดการ์ดจับคู่ โน้ตบนบรรทัดห้าเส้นกับชื่อโน้ต ฝึกอ่านโน้ตและความจำ"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dfe9ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a21" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E
%3Ccircle cx='12' cy='23' r='6' fill='%23c4421f'/%3E
%3Cpath d='M17 23V4h4v19' fill='%23c4421f'/%3E%3C/svg%3E"
    />
    <meta property="og:title" content="จับคู่โน้ต" />
    <meta
      property="og:description"
      content="เกมเปิดการ์ดจับคู่ โน้ตบนบรรทัดห้าเส้นกับชื่อโน้ต ฝึกอ่านโน้ตและความจำ"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <style>
      /* สีหลัก */
      :root {
        --value-0: 0;
        --value-16px: 16px;
        --value-1point-6: 1.6;
        --value-592px: 592px;
        --value-24px: 24px;
        --value-28px: 28px;
        --value-1point-4: 1.4;
        --value-18px: 18px;
        --value-8px: 8px;
        --value-1px: 1px;
        --value-12px: 12px;
        --value-44px: 44px;
        --value-3px: 3px;
        --value-2px: 2px;
        --value-point-5: 0.5;
        --value-52px: 52px;
        --value-700: 700;
        --value-point-98: 0.98;
        --value-22px: 22px;
        --value-1point-3: 1.3;
        --value-1fr: 1fr;
        --value-3: 3;
        --value-4: 4;
        --value-100pct: 100%;
        --value-80pct: 80%;
        --value-65pct: 65%;
        --value-7vw: 7vw;
        --value-40px: 40px;
        --value-14px: 14px;
        --value-50pct: 50%;
        --bg: #dfe9ef;
        --surface: #fff;
        --surface-2: #f3f8fa;
        --line: #c6d6e0;
        --line-strong: #b5c8d4;
        --text: #17252f;
        --text-soft: #33454f;
        --muted: #5f7584;
        --action: #c4421f;
        --action-ink: #fff;
        --action-soft: #fdece7;
        --blue: #3f6f8d;
        --blue-soft: #e3eef5;
        --brass: #9a6a1f;
        --good: #2e7d59;
        --warn: #9a6a1f;
        --bad: #b3261e;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0f1a21;
          --surface: #172630;
          --surface-2: #1c2f3b;
          --line: #2c4150;
          --line-strong: #3a5263;
          --text: #e6eef3;
          --text-soft: #c3d3dc;
          --muted: #8ea3b1;
          --action: #f07a5a;
          --action-ink: #1b0e09;
          --action-soft: #3a221b;
          --blue: #8cb8d3;
          --blue-soft: #1d3442;
          --brass: #d9a94f;
          --good: #7fd1a6;
          --warn: #e3b04b;
          --bad: #ff8a80;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: var(--value-0);
        background: var(--bg);
        color: var(--text);
        font:
          var(--value-16px)/var(--value-1point-6) 'Sarabun',
          'Leelawadee UI',
          'Noto Sans Thai',
          Thonburi,
          Tahoma,
          system-ui,
          sans-serif;
      }
      main {
        max-width: var(--value-592px);
        margin: auto;
        padding: var(--value-24px) var(--value-16px);
      }
      h1,
      h2,
      p {
        margin: var(--value-0);
      }
      h1 {
        font-size: var(--value-28px);
        line-height: var(--value-1point-4);
      }
      h2 {
        font-size: var(--value-18px);
        margin: var(--value-16px) var(--value-0) var(--value-8px);
      }
      header {
        margin-bottom: var(--value-16px);
      }
      header p {
        color: var(--text-soft);
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: var(--value-1px) solid var(--line);
        border-radius: var(--value-12px);
        min-height: var(--value-44px);
        padding: var(--value-8px) var(--value-12px);
        cursor: pointer;
        touch-action: manipulation;
      }
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible {
        outline: var(--value-3px) solid var(--blue);
        outline-offset: var(--value-2px);
      }
      button:disabled {
        opacity: var(--value-point-5);
      }
      button.primary {
        background: var(--action);
        color: var(--action-ink);
        border-color: var(--action);
        min-height: var(--value-52px);
        font-weight: var(--value-700);
      }
      button:active {
        transform: scale(var(--value-point-98));
      }
      .hud {
        display: flex;
        gap: var(--value-24px);
        align-items: center;
        margin-bottom: var(--value-12px);
      }
      .hud strong {
        display: block;
        font-size: var(--value-22px);
        line-height: var(--value-1point-3);
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(var(--cols), minmax(var(--value-0), var(--value-1fr)));
        gap: var(--value-8px);
      }
      .card {
        position: relative;
        aspect-ratio: var(--value-3) / var(--value-4);
        padding: var(--value-0);
        min-width: var(--value-0);
        overflow: hidden;
        background: var(--surface);
        user-select: none;
        transition: transform var(--flip-ms);
      }
      .card.is-animating {
        animation: flip-card var(--flip-ms) ease-out;
      }
      @keyframes flip-card {
        from {
          transform: rotateY(90deg);
        }
        to {
          transform: rotateY(var(--value-0));
        }
      }
      .card-back {
        --back-bg: var(--blue);
        --back-line: var(--surface);
        --back-accent: var(--brass);
        background: var(--back-bg);
        width: var(--value-100pct);
        height: var(--value-100pct);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-back svg {
        width: var(--value-80pct);
        height: var(--value-65pct);
      }
      .card svg.staff {
        width: var(--value-100pct);
        height: var(--value-100pct);
        color: var(--text);
      }
      .card .face-text {
        display: block;
        font-size: clamp(var(--value-22px), var(--value-7vw), var(--value-40px));
        font-weight: var(--value-700);
        line-height: var(--value-1point-3);
      }
      .card .register {
        display: block;
        font-size: var(--value-14px);
      }
      .card.is-matched {
        border: var(--value-2px) solid var(--good);
      }
      .card.is-miss {
        border: var(--value-2px) solid var(--bad);
      }
      .card .mark {
        position: absolute;
        top: var(--value-0);
        right: var(--value-3px);
        background: var(--surface);
        color: var(--text);
        font-size: var(--value-12px);
        font-weight: var(--value-700);
      }
      .actions {
        display: flex;
        gap: var(--value-8px);
        flex-wrap: wrap;
        margin: var(--value-16px) var(--value-0);
      }
      .segments {
        display: flex;
        gap: var(--value-8px);
        flex-wrap: wrap;
      }
      .segments button[aria-pressed='true'] {
        background: var(--surface);
        border-color: var(--blue);
        outline: var(--value-1px) solid var(--blue);
      }
      .options,
      .settings,
      #finish,
      #checkResult {
        background: var(--surface);
        border: var(--value-1px) solid var(--line);
        border-radius: var(--value-18px);
        padding: var(--value-16px);
        margin-top: var(--value-16px);
      }
      .settings summary {
        font-weight: var(--value-700);
        cursor: pointer;
        min-height: var(--value-44px);
      }
      .settings label {
        display: block;
      }
      .settings input[type="range"] {
        width: var(--value-100pct);
      }
      #checkResult .is-pass {
        color: var(--good);
      }
      #checkResult .is-fail {
        color: var(--bad);
      }
      #notice:empty,
      [data-slot]:empty {
        display: none;
      }
      #notice {
        margin: var(--value-8px) var(--value-0);
        color: var(--text-soft);
      }
      footer {
        margin-top: var(--value-24px);
        color: var(--text-soft);
        font-size: var(--value-14px);
      }
      .sr {
        position: absolute;
        width: var(--value-1px);
        height: var(--value-1px);
        overflow: hidden;
        clip-path: inset(var(--value-50pct));
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
        .card.is-animating {
          animation: none;
        }
      }
      /* สีของเกม */
      :root {
        --deck-surface: var(--surface); /* พื้นสำรับ */
        --medal-ink: var(--brass); /* เส้นเหรียญ */
        --medal-fill: var(--action-soft); /* พื้นเหรียญที่ได้รับ */
        --fact-surface: var(--blue-soft); /* พื้นแถบอธิบาย */
        /* ขนาดและระยะ */
        --sample-size: 46px; /* ขนาดตัวอย่างบนปุ่ม */
        --medal-size: 32px; /* ขนาดเหรียญ */
        --note-text: clamp(0.75rem, 3.9vw, 1.25rem); /* ขนาดข้อความยาวบนการ์ด */
        --space-v2: 12px; /* ระยะห่างพื้นฐาน */
        --deck-line: 1px; /* เส้นขอบสำรับ */
        --pop-distance: 12px; /* ระยะลอยของคะแนน */
        --pop-duration: 200ms; /* เวลาแสดงคะแนน */
        --result-step: 80ms; /* ระยะหน่วงระหว่างผลแต่ละบรรทัด */
      }
      .deck-picker {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--space-v2);
      }
      .deck-picker button {
        background: var(--deck-surface);
        text-align: start;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        min-width: 0;
      }
      .deck-picker button[aria-pressed='true'] {
        outline: var(--deck-line) solid var(--action);
        border-color: var(--action);
      }
      .deck-picker small, #modeAbout, #homeBest {
        color: var(--text-soft);
      }
      .deck-picker svg, .steps svg {
        width: var(--sample-size);
        height: var(--sample-size);
      }
      .medals {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-v2);
      }
      .medals svg, .badge-list svg {
        color: var(--medal-ink);
        width: var(--medal-size);
        height: var(--medal-size);
        vertical-align: middle;
        margin-inline-end: var(--space-v2);
      }
      .medal-earned circle {
        fill: var(--medal-fill);
      }
      .badge-list, .steps {
        padding-inline-start: var(--space-v2);
      }
      .badge-list li, .steps li {
        margin-block-end: var(--space-v2);
      }
      .steps svg {
        vertical-align: middle;
        margin-inline-end: var(--space-v2);
      }
      h1:focus {
        outline: none;
      }
      #raceClock progress {
        width: 100%;
        accent-color: var(--action);
      }
      .fact:not(:empty), #toast:not([hidden]) {
        background: var(--fact-surface);
        color: var(--text);
        margin-block: var(--space-v2);
        padding: var(--space-v2);
      }
      .card .face-text.is-long {
        font-size: var(--note-text);
        overflow-wrap: anywhere;
        padding-inline: var(--space-v2);
      }
      .card .sound-icon, .card .symbol-icon {
        max-width: var(--sample-size);
        display: block;
        margin-inline: auto;
      }
      .score-pop {
        animation: note-score-pop var(--pop-duration) ease-out;
      }
      @keyframes note-score-pop {
        from { transform: translateY(var(--pop-distance)); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      #finish svg {
        width: var(--sample-size);
        height: var(--sample-size);
        vertical-align: middle;
      }
      #finish p {
        opacity: 0;
        transition: opacity var(--pop-duration);
        transition-delay: calc(var(--result-step) * var(--row, 0));
      }
      #finish.is-revealed p, :root[data-reduce='true'] #finish p {
        opacity: 1;
      }
      :root[data-reduce='true'] *, :root[data-reduce='true'] *::after {
        animation: none !important;
        transition: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .score-pop, #finish p {
          opacity: 1;
          animation: none;
          transition: none;
        }
      }
      :root[data-theme="dark"] {
          --bg: #0f1a21;
          --surface: #172630;
          --surface-2: #1c2f3b;
          --line: #2c4150;
          --line-strong: #3a5263;
          --text: #e6eef3;
          --text-soft: #c3d3dc;
          --muted: #8ea3b1;
          --action: #f07a5a;
          --action-ink: #1b0e09;
          --action-soft: #3a221b;
          --blue: #8cb8d3;
          --blue-soft: #1d3442;
          --brass: #d9a94f;
          --good: #7fd1a6;
          --warn: #e3b04b;
          --bad: #ff8a80;
          color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <main>
      <section data-screen="home">
        <header class="home-title">
          <h1 tabindex="-1">จับคู่โน้ต</h1>
          <p>เปิดการ์ด จำตำแหน่ง แล้วจับคู่ให้ครบ</p>
        </header>
        <h2>เลือกสำรับ</h2>
        <div id="decks" class="deck-picker"></div>
        <h2>เลือกโหมด</h2>
        <div id="modes" class="segments"></div>
        <p id="modeAbout"></p>
        <p id="earNotice" role="status"></p>
        <div id="slotHome" data-slot="home"></div>
        <div id="levelChoice">
          <h2>ระดับ</h2>
          <div id="levels" class="segments"></div>
        </div>
        <p id="homeBest"></p>
        <div class="actions">
          <button id="startPlay" class="primary">เริ่มเล่น</button>
          <button id="openHowto">วิธีเล่น</button>
          <button id="openBadges">เหรียญของฉัน</button>
        </div>
        <div id="homeBadges" class="medals"></div>
      </section>
      <section data-screen="play" hidden>
        <h1 tabindex="-1">จับคู่โน้ต</h1>
        <div class="hud" aria-label="ผลการเล่น">
          <div>คะแนน <strong id="playScore">0</strong></div>
          <div>ครั้งที่เปิด <strong id="turns">0</strong></div>
          <div>คู่ที่เจอ <strong id="found">0</strong></div>
          <div><strong id="streak"></strong></div>
          <div id="slotHud" data-slot="hud"></div>
        </div>
        <div id="raceClock" hidden>เวลา <strong id="clockReadout"></strong>
          <progress id="clockBar" aria-label="เวลาที่เหลือ"></progress>
        </div>
        <p id="notice" role="status"></p>
        <div id="grid" class="grid"></div>
        <p id="fact" class="fact" aria-live="polite"></p>
        <p id="live" class="sr" aria-live="polite"></p>
        <div class="actions">
          <button id="newGame">เกมใหม่</button>
          <button id="replay" hidden>ฟังอีกครั้ง</button>
          <button id="pauseRace" hidden>หยุดชั่วคราว</button>
          <button id="quit">ออก</button>
          <div id="slotActions" data-slot="actions"></div>
        </div>
        <div id="slotPanel" data-slot="panel"></div>
      </section>
      <section data-screen="result" hidden>
        <h1 id="resultHeading" tabindex="-1"></h1>
        <div id="finish"></div>
        <div id="slotResult" data-slot="result"></div>
        <div class="actions">
          <button id="again" class="primary">เล่นอีกครั้ง</button>
          <button id="changeMode">เปลี่ยนโหมด</button>
        </div>
      </section>
      <section data-screen="howto" hidden>
        <h1 tabindex="-1">วิธีเล่น</h1>
        <ol id="instructions" class="steps"></ol>
        <button id="closeHowto" class="primary">ไปหน้าแรก</button>
      </section>
      <section data-screen="paused" hidden>
        <h1 tabindex="-1">หยุดชั่วคราว</h1>
        <button id="resumeRace" class="primary">เล่นต่อ</button>
      </section>
      <section data-screen="badges" hidden>
        <h1 tabindex="-1">เหรียญของฉัน</h1>
        <ul id="badgeList" class="badge-list"></ul>
        <button id="closeBadges">ไปหน้าแรก</button>
      </section>
      <p id="toast" role="status" aria-live="polite" hidden></p>
      <details class="settings">
        <summary>ตั้งค่า</summary>
        <h2>ชื่อโน้ต</h2>
        <div id="names" class="segments"></div>
        <label for="theme">ธีม</label>
        <select id="theme">
          <option value="auto">อัตโนมัติ</option><option value="light">สว่าง</option>
          <option value="dark">มืด</option>
        </select>
        <label><input id="reduce" type="checkbox"> ลดการเคลื่อนไหว</label>
        <button id="clearStats">ล้างข้อมูลของเกมนี้</button>
        <label for="volume">ระดับเสียง</label
        ><input type="range" id="volume" min="0" max="100" value="25" />
        <div class="actions">
          <button id="testSound">ทดสอบเสียง</button><button id="check">ตรวจระบบ</button>
        </div>
        <div id="checkResult" hidden></div>
      </details>
      <footer>จับคู่โน้ต · สร้างด้วย AI ช่วย · วิชา 3500230</footer>
    </main>
    <script>
      (function () {
        'use strict';
        /* ═══════════ โซน A · ข้อมูล (แก้ได้) ═══════════ */
        /* สำรับ: id คือรหัส title คือชื่อ pairs คือคู่ที่มี key และหน้าการ์ด a, b */
        var DECKS = [
          {
            id: 'treble',
            title: 'กุญแจซอล',
            about: 'โน้ตบนบรรทัดห้าเส้นกุญแจซอล',
            pairs: [
              { key: 'C4', a: { kind: 'staff', note: 'C4' }, b: { kind: 'text', text: 'C', sub: 'โด' }},
              { key: 'D4', a: { kind: 'staff', note: 'D4' }, b: { kind: 'text', text: 'D', sub: 'เร' }},
              { key: 'E4', a: { kind: 'staff', note: 'E4' }, b: { kind: 'text', text: 'E', sub: 'มี' }},
              { key: 'F4', a: { kind: 'staff', note: 'F4' }, b: { kind: 'text', text: 'F', sub: 'ฟา' }},
              { key: 'G4', a: { kind: 'staff', note: 'G4' }, b: { kind: 'text', text: 'G', sub: 'ซอล' }},
              { key: 'A4', a: { kind: 'staff', note: 'A4' }, b: { kind: 'text', text: 'A', sub: 'ลา' }},
              { key: 'B4', a: { kind: 'staff', note: 'B4' }, b: { kind: 'text', text: 'B', sub: 'ที' }},
              { key: 'C5', a: { kind: 'staff', note: 'C5' }, b: { kind: 'text', text: 'C', sub: 'โด' }},
              { key: 'D5', a: { kind: 'staff', note: 'D5' }, b: { kind: 'text', text: 'D', sub: 'เร' }},
              { key: 'E5', a: { kind: 'staff', note: 'E5' }, b: { kind: 'text', text: 'E', sub: 'มี' }},
              { key: 'F5', a: { kind: 'staff', note: 'F5' }, b: { kind: 'text', text: 'F', sub: 'ฟา' }},
              { key: 'G5', a: { kind: 'staff', note: 'G5' }, b: { kind: 'text', text: 'G', sub: 'ซอล' }},
              { key: 'A5', a: { kind: 'staff', note: 'A5' }, b: { kind: 'text', text: 'A', sub: 'ลา' }}
            ]
          }
        ];
        /* ระดับ: id คือรหัส label คือชื่อ pairs คือจำนวนคู่ cols คือจำนวนคอลัมน์ */
        var LEVELS = [
          { id: 'easy', label: 'ง่าย', pairs: 6, cols: 3 },
          { id: 'medium', label: 'กลาง', pairs: 8, cols: 4 },

        };
        /* ═══════════ โซน C · แกนเกม (ห้ามแก้) ═══════════ */
        var Core = {};

        // สับรายการด้วยตัวเลขสุ่มที่ส่งเข้ามา
        Core.shuffle = function (items, rng) {
          var a = items.slice(),
            i,
            j,
            t;
          for (i = a.length - 1; i > 0; i--) {
            j = Math.floor(rng() * (i + 1));
            t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        };

        // เลือกคู่การ์ดโดยไม่เลือกซ้ำ
        Core.pickPairs = function (deck, count, rng) {
          return Core.shuffle(deck.pairs, rng).slice(0, count);
        };

        // แยกชื่อโน้ตที่ใช้อักษรซ้ำกัน
        Core.labelPairs = function (pairs, notes) {
          return pairs.map(function (pair) {
            var p = JSON.parse(JSON.stringify(pair));
            ['a', 'b'].forEach(function (side) {
              var face = p[side];
              if (face.kind !== 'text') return;
              var staff =
                pair.a.kind === 'staff' ? pair.a : pair.b.kind === 'staff' ? pair.b : null;
              if (!staff) return;
              var note = notes.find(function (n) {
                return n.name === staff.note;
              });
              if (!note) return;
              var matching = pairs
                .map(function (q) {
                  var s = q.a.kind === 'staff' ? q.a : q.b.kind === 'staff' ? q.b : null;
                  return (
                    s &&
                    notes.find(function (n) {
                      return n.name === s.note && n.letter === note.letter;
                    })
                  );
                })
                .filter(Boolean);
              if (matching.length > 1) {
                var sorted = matching
                  .map(function (n) {
                    return n.midi;
                  })
                  .sort(function (a, b) {
                    return a - b;
                  });
                face.register = note.midi === sorted[0] ? 'ต่ำ' : 'สูง';
              }
            });
            return p;
          });
        };

        // สร้างและสับการ์ดสองใบต่อหนึ่งคู่
        Core.buildCards = function (pairs, rng) {
          var cards = [];
          pairs.forEach(function (p) {
            ['a', 'b'].forEach(function (s) {
              cards.push({ id: p.key + ':' + s, key: p.key, face: p[s], state: 'down' });
            });
          });
          return Core.shuffle(cards, rng);
        };

        // ตรวจว่าจับคู่ครบทุกใบหรือยัง
        Core.isWon = function (s) {
          return (
            s.cards.length > 0 &&
            s.cards.every(function (c) {
              return c.state === 'matched';
            })
          );
        };

        // เปิดการ์ดหนึ่งใบและตัดสินผลเมื่อเปิดครบสองใบ
        Core.flip = function (state, id) {
          if (state.locked || Core.isWon(state)) return state;
          var card = state.cards.find(function (c) {
            return c.id === id;
          });
          if (!card || card.state !== 'down') return state;
          var s = Object.assign({}, state, {
            cards: state.cards.map(function (c) {
              return Object.assign({}, c);
            })
          });
          var target = s.cards.find(function (c) {
            return c.id === id;
          });
          target.state = 'up';
          var up = s.cards.filter(function (c) {
            return c.state === 'up';
          });
          if (up.length === 2) {
            s.turns++;
            if (up[0].key === up[1].key) {
              up.forEach(function (c) {
                c.state = 'matched';
              });
              s.found++;
            } else {
              s.locked = true;
              s.pending = up.map(function (c) {
                return c.id;
              });
            }
          }
          return s;
        };

        // คว่ำคู่ที่เปิดผิดและปลดล็อก
        Core.resolve = function (state) {
          if (!state.locked || !state.pending) return state;
          return Object.assign({}, state, {
            locked: false,
            pending: [],
            cards: state.cards.map(function (c) {
              return state.pending.indexOf(c.id) >= 0
                ? Object.assign({}, c, { state: 'down' })
                : Object.assign({}, c);
            })
          });
        };

        // แปลงตำแหน่งโน้ตเป็นพิกัดแนวตั้ง
        Core.stepY = function (step, bottomY, gapPx) {
          return bottomY - (step * gapPx) / 2;
        };

        // หาตำแหน่งเส้นน้อยที่ต้องวาด
        Core.ledgerSteps = function (step) {
          var out = [],
            i;
          if (step <= -2) {
            for (i = -2; i >= step; i -= 2) out.push(i);
          } else if (step >= 10) {
            for (i = 10; i <= step; i += 2) out.push(i);
          }
          return out;
        };

        Core.midiToHz = function (midi) {

        Core.stars = function (turns, pairs) {
          return turns <= pairs + 2 ? 3 : turns <= pairs * 2 ? 2 : 1;
        };

        Core.findNote = function (face) {

          return table.find(function (note) {
            return note.name === face.note;

        // เปลี่ยนขั้นบนบรรทัดห้าเส้นเป็นคำอธิบายตำแหน่ง
        Core.describeStep = function (step) {
          if (step <= -2) return 'บนเส้นน้อยใต้บรรทัด';
          if (step >= 10) return 'บนเส้นน้อยเหนือบรรทัด';
          if (step === -1) return 'ใต้บรรทัด';
          if (step === 9) return 'เหนือบรรทัด';
          return step % 2 === 0 ? 'บนเส้นที่ ' + (step / 2 + 1) : 'ในช่องที่ ' + ((step + 1) / 2);
        };

        Core.canListen = function (deck) {

        // สร้างคู่การ์ดตามโหมด โดยไม่แก้ไขข้อมูลสำรับ
        Core.modePairs = function (deck, mode, count, rng) {
          if (mode !== 'ear') return Core.pickPairs(deck, count, rng);
          var staffPairs = deck.pairs.filter(function (pair) {
            return pair.a.kind === 'staff' || pair.b.kind === 'staff';
          });
          return Core.pickPairs({ pairs: staffPairs }, count, rng).map(function (pair) {
            var note = pair.a.kind === 'staff' ? pair.a : pair.b;
            return {
              key: pair.key,
              a: note,
              b: { kind: 'sound', note: note.note, clef: note.clef }

          });

        Core.scoreMatch = function (state) {
          var streak = (state.streak || 0) + 1;
          var multiplier = Math.min(streak, CONFIG.maxMultiplier);
          var update = {
            score: (state.score || 0) + CONFIG.matchPoints * multiplier,
            matches: (state.matches || 0) + 1,
            streak: streak,
            bestStreak: Math.max(state.bestStreak || 0, streak),
            multiplier: multiplier
          };
          if (state.mode === 'race') update.secondsLeft = state.secondsLeft + CONFIG.raceBonusSec;
          return Object.assign({}, state, update);
        };

        // หักคะแนนและบันทึกรหัสของการ์ดที่เปิดผิดคู่
        Core.scoreMiss = function (state, keys) {
          return Object.assign({}, state, {
            score: Math.max(0, (state.score || 0) - CONFIG.missPenalty),
            misses: (state.misses || 0) + 1,
            streak: 0,
            multiplier: 1,
            confusions: (state.confusions || []).concat([keys.slice()])
          });
        };

        // เพิ่มคะแนนโบนัสเมื่อเล่นโหมดปกติจนจบ
        Core.finalScore = function (state, mode) {
          var bonus = mode === 'classic' && Core.isWon(state)
            ? CONFIG.finishBonus * Core.stars(state.turns, state.pairs)
            : 0;
          return (state.score || 0) + bonus;
        };

        // เรียงรหัสการ์ดที่เปิดผิดบ่อยจากมากไปหาน้อย
        Core.rankConfusions = function (misses) {
          var counts = new Map();
          misses.forEach(function (keys) {
            keys.forEach(function (key) {
              counts.set(key, (counts.get(key) || 0) + 1);
            });
          });
          return Array.from(counts.keys()).sort(function (a, b) {
            return counts.get(b) - counts.get(a) || a.localeCompare(b);
          }).filter(function (key) {
            return counts.get(key) > 1;
          });
        };

        Core.badgeRules = {
          wins: function (r, goal) { return Object.keys(r.wins).length >= goal; },
          clean: function (r, goal) { return r.won && r.mode === 'classic' && r.misses === goal; },
          streak: function (r, goal) { return r.bestStreak >= goal; },
          stars: function (r, goal) { return r.level === 'hard' && r.stars >= goal; },
          ear: function (r) { return r.won && r.mode === 'ear'; },
          race: function (r, goal) { return r.mode === 'race' && r.matches >= goal; },
          decks: function (r) {
            return DECKS.every(function (deck) { return r.wins[deck.id] > 0; });

        function addBuiltInDecks() {
          var bass = BASS_NOTES.map(function (note) {
            return {
              key: note.name,
              a: { kind: 'staff', clef: 'bass', note: note.name },
              b: { kind: 'text', text: note.letter, sub: note.solfege }
